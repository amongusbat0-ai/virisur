name: Build ViriSur

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Nettoyage du cache Maven
        run: rm -rf ~/.m2/repository

      - name: Compilation du plugin
        run: mvn -B clean package -U
        working-directory: virisur-plugin

      - name: Récupération du fichier JAR
        uses: actions/upload-artifact@v4
        with:
          name: ViriSur
          path: virisur-plugin/target/*.jar
